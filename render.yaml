# Render Blueprint — one web service hosts the game client + Socket.IO server.
services:
  - type: web
    name: arcana
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        value: "*"
